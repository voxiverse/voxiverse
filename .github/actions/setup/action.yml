name: setup
description: The toolchain as a developer sets it up (odinup, the pinned Odin), cached; with dev, ols and odinfmt too.
inputs:
  dev:
    description: also the project tools (ols, odinfmt) that `build check` needs
    default: "false"
runs:
  using: composite
  steps:
    # Per runner image, not just per OS: a toolchain built on a newer
    # Ubuntu may not run on the older one the Linux package is built on.
    - name: Runner image
      id: image
      shell: bash
      run: echo "name=${ImageOS:-${{ runner.os }}}" >> "$GITHUB_OUTPUT"

    - name: Cache toolchain
      uses: actions/cache@v4
      with:
        path: ~/.odinup
        key: odinup-${{ steps.image.outputs.name }}-${{ hashFiles('odinup.toml') }}

    - name: Cache shader compiler
      uses: actions/cache@v4
      with:
        path: build/tools
        key: glslang-${{ steps.image.outputs.name }}-${{ hashFiles('tools/build/glslang.odin') }}

    - name: Toolchain (Linux, macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        # The cache holds the toolchain, not what it needs from the system
        # (Linux: LLVM from apt): a fresh runner may lack it. Then it is
        # installed from scratch, which installs that too.
        if ! "$HOME/.odinup/odin/odin" version >/dev/null 2>&1; then
          rm -rf "$HOME/.odinup"
          ODIN="$(sed -n 's/^odin = "\(.*\)"/\1/p' odinup.toml)"
          curl -sSfL https://raw.githubusercontent.com/voxiverse/odinup/main/install.sh | ODINUP_ODIN_VERSION="$ODIN" sh
        fi
        echo "$HOME/.odinup/bin" >> "$GITHUB_PATH"

    - name: Toolchain (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        if (-not (Test-Path "$env:USERPROFILE\.odinup\bin\odinup.exe")) {
          $env:ODINUP_ODIN_VERSION = (Select-String -Path odinup.toml -Pattern '^odin = "(.*)"').Matches[0].Groups[1].Value
          irm https://raw.githubusercontent.com/voxiverse/odinup/main/install.ps1 | iex
        }
        "$env:USERPROFILE\.odinup\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

    - name: Project tools (ols, odinfmt)
      if: inputs.dev == 'true'
      shell: bash
      run: |
        odinup install --dev
        odinup check --dev
