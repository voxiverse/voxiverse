name: setup
description: The pinned Odin (an official prebuilt release, by setup-odin), with dev odinfmt too, and the shader compiler's cache.
inputs:
  dev:
    description: also odinfmt (at the ols revision odinup.toml pins), which `build check` needs
    default: "false"
runs:
  using: composite
  steps:
    # The versions developers use (odinup.toml, which odinup installs from
    # on their machines); CI downloads the same release prebuilt instead of
    # building Odin from source.
    - name: Pins
      id: pins
      shell: bash
      run: |
        echo "odin=$(sed -n 's/^odin = "\(.*\)"/\1/p' odinup.toml)" >> "$GITHUB_OUTPUT"
        echo "ols=$(sed -n '/^\[tools.ols\]/,/^\[/s/^rev = "\(.*\)"/\1/p' odinup.toml)" >> "$GITHUB_OUTPUT"
        echo "image=${ImageOS:-${{ runner.os }}}" >> "$GITHUB_OUTPUT"

    - name: Odin
      uses: laytan/setup-odin@8536d8fa450ec6f1bd9ddc84bbaaf16296c0051d # v2.12.2
      with:
        token: ${{ github.token }}
        release: ${{ steps.pins.outputs.odin }}

    - name: Cache shader compiler
      uses: actions/cache@v6
      with:
        path: build/tools
        key: glslang-${{ steps.pins.outputs.image }}-${{ hashFiles('tools/build/glslang.odin') }}

    - name: Cache odinfmt
      if: inputs.dev == 'true'
      id: odinfmt
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/odinfmt
        key: odinfmt-${{ steps.pins.outputs.image }}-${{ steps.pins.outputs.odin }}-${{ steps.pins.outputs.ols }}

    - name: odinfmt
      if: inputs.dev == 'true'
      shell: bash
      run: |
        out="$RUNNER_TEMP/odinfmt"
        if [ "${{ steps.odinfmt.outputs.cache-hit }}" != "true" ]; then
          git clone -q https://github.com/DanielGavin/ols "$RUNNER_TEMP/ols"
          git -C "$RUNNER_TEMP/ols" checkout -q "${{ steps.pins.outputs.ols }}"
          mkdir -p "$out"
          exe="$out/odinfmt${{ runner.os == 'Windows' && '.exe' || '' }}"
          (cd "$RUNNER_TEMP/ols" && odin build tools/odinfmt/main.odin -file -collection:src=src -o:speed "-out:$exe")
        fi
        echo "$out" >> "$GITHUB_PATH"
