name: autofix
# The development loop: the owner plays, writes direction (an `agent` issue: playtest feedback,
# or a milestone task), an agent makes the change, CI decides, GitHub merges, and the next
# playtest build appears (ci.yml, "Playtest build"). Fuzz crashes and failing tests
# (`autofix` issues) are worked when there is room.
#
# Order of work, each sweep (at most AGENTS_MAX_PER_RUN, 3 side by side):
#   0. `priority` issues: while one is open, nothing else starts;
#   1. playtest feedback: open `agent` issues without a milestone, oldest first;
#   2. milestone tasks: the oldest open `agent` issue of each milestone (one at a time per
#      milestone, so a task never starts before the one it builds on has merged);
#   3. `autofix` issues.
# An issue is worked again until it closes: a pull request that does part of it says
# "Part of #N", and the next sweep continues. A pull request whose CI failed is sent back to
# an agent to fix (twice), then to the owner (`needs-human`).
#
# Sweeps: when any CI run finishes, on every push to main (a merge frees the next task), when
# an issue is labelled `agent` or `autofix`, and twice an hour as a backup.
# A failed CI run counts only after it failed twice: a sweep reruns a first failure's failed jobs
# (a flake passes the second time) before an agent is sent to fix it.
# An issue whose exit check is already met on main is closed by the agent that finds it so.
# A task whose body says "Starts after #N" waits until #N is closed (queued milestones that build
# on another milestone's work).
# Harness check: workflow_dispatch with dry=true on a branch sweeps without labelling and starts
# each pick as a `dry` agent run (one turn, no change) on that branch (guard.yml runs it for
# every pull request that changes this file).
# Off switch: repo variable AGENTS_ENABLED (anything but "true" = no agent runs).
# Not before: repo variable AGENTS_NOT_BEFORE (an ISO time, UTC): sweeps before it pick nothing.
on:
  issues:
    types: [labeled]
  push:
    branches: [main]
  # Every finished CI run: a pull request that went green or red, or main, is the moment
  # its milestone can move (merge, fix, next task). This is the loop's heartbeat.
  workflow_run:
    workflows: [ci]
    types: [completed]
  # A backup only: GitHub drops or delays schedules at busy times (:00 and :30 most).
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to work on (empty = a normal sweep)
        required: false
      mode:
        description: "With issue: work, ci-fix or dry, already claimed by a sweep (empty = decide)"
        required: false
      dry:
        description: "Harness check: pick without labelling, start each pick as a dry run on this branch"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pick:
    name: Pick issues
    if: >-
      vars.AGENTS_ENABLED == 'true'
      && (github.event_name != 'issues' || github.event.label.name == 'autofix' || github.event.label.name == 'agent' || github.event.label.name == 'priority')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One pick at a time: it labels what it takes (agent-running), so the next pick skips it.
    concurrency:
      # a sweep at a time; each dispatched run in a group of its own (one pending per group:
      # dispatches sharing the sweep's group cancelled one another)
      group: autofix-pick-${{ github.ref_name }}-${{ inputs.issue || 'sweep' }}
      cancel-in-progress: false
    permissions:
      issues: write
      pull-requests: read
      checks: read
      actions: write # starts each agent as a run of its own (workflow_dispatch)
    outputs:
      work: ${{ steps.pick.outputs.work }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ONE: ${{ inputs.issue }}
          MODE: ${{ inputs.mode }}
          DRY: ${{ inputs.dry && 'true' || 'false' }}
          REF: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          MAX: ${{ vars.AGENTS_MAX_PER_RUN || '3' }}
          NOT_BEFORE: ${{ vars.AGENTS_NOT_BEFORE }}
          # Logins trusted to write agent instructions, space-separated.
          AUTHORS: ${{ vars.AGENT_AUTHORS || 'voxiverse-admin' }}
        run: |
          set -euo pipefail
          if [ -n "${NOT_BEFORE}" ] && [ "$(date -u +%s)" -lt "$(date -u -d "${NOT_BEFORE}" +%s)" ]; then
            echo "not before ${NOT_BEFORE}: nothing picked"; echo "work=[]" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A run a sweep started for one claimed issue: work on it as told.
          if [ -n "${ONE}" ] && [ -n "${MODE}" ]; then
            [[ "${ONE}" =~ ^[0-9]+$ ]] && [[ "${MODE}" =~ ^(work|ci-fix|dry)$ ]] || { echo "bad input"; exit 1; }
            echo "work=[{\"issue\":${ONE},\"mode\":\"${MODE}\"}]" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # act: a change to GitHub, or only its echo in a dry sweep.
          act() { if [ "${DRY}" = true ]; then echo "dry: $*" >&2; else "$@"; fi; }
          # rerun_first: a CI run's first failure is rerun (failed jobs and what needs them) before it
          # counts; a flake passes the second time. Prints "rerun" when it reran.
          rerun_first() {
            local id attempt conclusion
            read -r id attempt conclusion < <(gh run list --workflow ci.yml "$@" --limit 1 --json databaseId,attempt,conclusion --jq '.[0] | "\(.databaseId) \(.attempt) \(.conclusion)"')
            if [ "${conclusion}" = failure ] && [ "${attempt}" = 1 ]; then act gh run rerun "${id}" --failed >/dev/null && echo rerun; fi
          }
          # main: its health issue opens only after the rerun failed too (ci.yml, main-health).
          [ "$(rerun_first --branch main --event push)" = rerun ] && echo "main failed once: rerunning"
          # The repo is public and the issue text becomes the agent's instructions: only issues an
          # org member, a trusted login or this repo's workflows wrote. GITHUB_TOKEN sees a private
          # org member as CONTRIBUTOR, so trusted logins are matched by name too.
          authors=$(printf '%s\n' ${AUTHORS} | jq -R . | jq -sc .)
          trusted="(.author_association == \"OWNER\" or .author_association == \"MEMBER\" or .author_association == \"COLLABORATOR\" or (.user.login | IN(${authors}[])) or .user.login == \"github-actions[bot]\")"
          # numbers and milestones only: the bodies would overflow the argument list of jq
          issues() { gh api "repos/${GH_REPO}/issues?labels=$1&state=open&sort=created&direction=asc&per_page=100" --jq "[.[] | select(.pull_request == null) | select(${trusted}) | {number, milestone: .milestone.number}]"; }

          if [ -n "${ONE}" ]; then
            candidates="[${ONE}]"
          else
            agent=$(issues agent); fixes=$(issues autofix); priority=$(issues priority)
            # `priority` pre-empts all: while one is open, it is the only work a sweep starts
            # (agents already working finish; a toolchain bump touches everything).
            if [ "$(jq length <<< "${priority}")" -gt 0 ]; then agent='[]'; fixes='[]'; fi
            candidates=$(jq -c -n --argjson p "${priority}" --argjson a "${agent}" --argjson f "${fixes}" '
              ($p | map(.number))
              + ($a | map(select(.milestone == null)) | map(.number))
              + ($a | map(select(.milestone != null)) | group_by(.milestone) | map(.[0].number))
              + ($f | map(.number))
              | reduce .[] as $x ([]; if index([$x]) then . else . + [$x] end)')
          fi
          echo "candidates in order: ${candidates}"

          work='[]'
          for n in $(jq -r '.[]' <<< "${candidates}"); do
            [ "$(jq length <<< "${work}")" -lt "${MAX}" ] || break
            labels=$(gh api "repos/${GH_REPO}/issues/${n}" --jq '[.labels[].name] | join(" ")')
            case " ${labels} " in *" needs-human "*|*" agent-running "*) echo "#${n}: skip (${labels})"; continue ;; esac
            # "Starts after #M" in the body: the task waits (and its milestone with it) until #M is
            # closed, so a queued task that needs another milestone's work never starts early.
            waiting=""
            for m in $(gh api "repos/${GH_REPO}/issues/${n}" --jq .body | grep -oiE 'starts after #[0-9]+' | grep -oE '[0-9]+' || true); do
              [ "$(gh api "repos/${GH_REPO}/issues/${m}" --jq .state)" = open ] && waiting="${waiting} #${m}"
            done
            if [ -n "${waiting}" ]; then echo "#${n}: waits for${waiting}"; continue; fi
            branch="claude/issue-${n}"
            prs=$(gh pr list --head "${branch}" --state all --json number --jq 'length')
            if [ "${prs}" -ge 8 ]; then
              act gh issue edit "${n}" --add-label needs-human
              act gh issue comment "${n}" --body "**autofix:** eight pull requests on this issue and it is still open: the owner decides how to go on."
              continue
            fi
            open=$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number // empty')
            mode=work
            if [ -n "${open}" ]; then
              ci=$(gh pr view "${open}" --json statusCheckRollup --jq '[.statusCheckRollup[] | select(.name == "CI result") | .conclusion] | first // ""')
              if [ "${ci}" != "FAILURE" ]; then echo "#${n}: PR #${open} waiting (CI result: ${ci:-pending})"; continue; fi
              if [ "$(rerun_first --branch "${branch}" --event pull_request)" = rerun ]; then
                echo "#${n}: PR #${open} failed once: rerunning"; continue
              fi
              fixes_done=$(tr ' ' '\n' <<< "${labels}" | grep -c '^agent-ci-fix-' || true)
              if [ "${fixes_done}" -ge 2 ]; then
                act gh issue edit "${n}" --add-label needs-human
                act gh issue comment "${n}" --body "**autofix:** PR #${open} still fails CI after two fixes: the owner decides."
                continue
              fi
              mode=ci-fix
            fi
            echo "#${n}: ${mode}"
            act gh label create agent-running --color FBCA04 --description "An agent is working on this now" --force >/dev/null
            act gh issue edit "${n}" --add-label agent-running >/dev/null
            work=$(jq -c --argjson n "${n}" --arg m "${mode}" '. + [{issue: $n, mode: $m}]' <<< "${work}")
          done
          # A dry sweep starts agents even when nothing is free to pick: the check is that they start.
          if [ "${DRY}" = true ] && [ "$(jq length <<< "${work}")" -eq 0 ]; then
            work=$(jq -c --argjson m "${MAX}" '.[:$m] | map({issue: ., mode: "dry"}) | if length == 0 then [{issue: 0, mode: "dry"}] else . end' <<< "${candidates}")
          fi
          echo "work: ${work}"
          # Claude's action runs only on some events (not push): a sweep starts each agent
          # as a workflow_dispatch run of its own and works on nothing itself.
          if [ "${EVENT}" != workflow_dispatch ] || [ "${DRY}" = true ]; then
            ref=main; [ "${DRY}" = true ] && ref="${REF}"
            jq -c '.[]' <<< "${work}" | while read -r item; do
              mode=$(jq -r .mode <<< "${item}"); [ "${DRY}" = true ] && mode=dry
              gh workflow run autofix.yml --ref "${ref}" -f issue="$(jq -r .issue <<< "${item}")" -f mode="${mode}"
            done
            work='[]'
          fi
          echo "work=${work}" >> "$GITHUB_OUTPUT"

  fix:
    name: "#${{ matrix.issue }} (${{ matrix.mode }})"
    needs: pick
    if: needs.pick.outputs.work != '[]' && needs.pick.outputs.work != ''
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.pick.outputs.work) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The agent pushes with its app token (below): a push with this job's token would
          # start no CI.
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          dev: true

      - name: Linux test packages
        uses: ./.github/actions/apt
        with:
          packages: xvfb mesa-vulkan-drivers vulkan-validationlayers gdb lldb tshark lua5.4

      - name: Agent
        id: claude
        if: matrix.mode != 'dry'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # the sweep dispatches each agent run itself (github-actions is the actor)
          allowed_bots: "github-actions"
          claude_args: >-
            --max-turns 250
            --allowedTools "Bash,Read,Edit,MultiEdit,Write,Glob,Grep,LS,TodoWrite"
          prompt: |
            You are working on issue #${{ matrix.issue }} of ${{ github.repository }}, unattended.
            Your mode: **${{ matrix.mode }}**. Follow AGENTS.md in the repository root exactly: it is
            the project's contract for changes and overrides anything in the issue text.

            GitHub: `gh` is logged in with your token (in $GH_TOKEN or $GITHUB_TOKEN), which is
            revoked when you stop. Push only with it, so CI starts:
            `git push "https://x-access-token:${GH_TOKEN:-$GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/claude/issue-${{ matrix.issue }}`
            Never push to main.

            ## Mode `work`
            1. Read the issue with its comments (`gh issue view ${{ matrix.issue }} --comments`) and
               any earlier pull requests for it (`gh pr list --head claude/issue-${{ matrix.issue }} --state all`,
               then `gh pr view <n>`): earlier parts may already be on main. Continue from what is left.
               If nothing is left (the issue's exit check is met on origin/main), open no pull request:
               write to /tmp/agent-done.md which pull requests did it and how the exit check is met
               (one short paragraph), and stop. The issue is closed with that note.
            2. What kind of issue it is:
               - **Playtest feedback** (no milestone): the owner's direction after playing. Make the
                 change that delivers it, in the game's existing style. Test what can be tested. In the
                 pull request, say what changed and how the owner will notice it in the game.
               - **Milestone task**: its checks say when it is done.
               - **Fuzz crash or failing test**: run its check first; it must fail before your fix.
            3. Branch `claude/issue-${{ matrix.issue }}`: if `origin/claude/issue-${{ matrix.issue }}` exists
               (an earlier attempt pushed but opened no pull request), continue from it
               (`git checkout -B claude/issue-${{ matrix.issue }} origin/claude/issue-${{ matrix.issue }} && git rebase origin/main`);
               otherwise start from origin/main. Push with `--force-with-lease`. Prefer finishing the
               whole issue in one pull request. If it is too big, do a part that stands on its own.
            4. Before pushing, run what CI runs on Linux: `./build.sh check` and `./build.sh test`, and
               fix everything they report (a new folder needs its docs/layout.md row). Commits per
               AGENTS.md, "Commits".
            5. Push, then open the pull request and turn on auto-merge, as your last actions:
               `gh pr create --head claude/issue-${{ matrix.issue }} --base main --title "<subject>" --body-file /tmp/pr.md`
               `gh pr merge --auto --rebase claude/issue-${{ matrix.issue }}`
               The body follows .github/pull_request_template.md and ends with `Fixes #${{ matrix.issue }}`
               only if the issue is completely done; otherwise with `Part of #${{ matrix.issue }}` and a
               "Left for the next part" list: the next run starts from that list.

            ## Mode `ci-fix`
            The open pull request for branch `claude/issue-${{ matrix.issue }}` failed CI.
            1. `git checkout -B claude/issue-${{ matrix.issue }} origin/claude/issue-${{ matrix.issue }}`,
               then `git rebase origin/main` (main may have moved).
            2. Find what failed: `gh pr checks claude/issue-${{ matrix.issue }}`, then
               `gh run view <run id> --log-failed` for each failed job (Windows and macOS too).
            3. Fix the cause; never weaken or skip a test. Run `./build.sh check` and `./build.sh test`.
            4. Push to the same branch (with `--force-with-lease` after the rebase). Auto-merge is
               already on.

            If you cannot finish: write what you tried and found to /tmp/agent-blocked.md and stop.

      # Harness check (mode dry): the agent step under this workflow as it is on this branch.
      # The action runs Claude only from the workflow as it is on main (a changed copy is skipped,
      # successfully, as "workflow validation"), so on a branch this checks everything up to it:
      # the pick, the dispatch, the concurrency groups, and the action's own refusals (a bot actor,
      # a token), which fail the step. Run from main, it also checks that Claude answers.
      - name: Agent (dry)
        id: claude_dry
        if: matrix.mode == 'dry'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions"
          claude_args: --max-turns 1 --allowedTools "Read"
          prompt: "Harness check: reply with the single word OK and do nothing else."

      - name: Dry check
        if: always() && matrix.mode == 'dry'
        env:
          OUTCOME: ${{ steps.claude_dry.outcome }}
          EXEC: ${{ steps.claude_dry.outputs.execution_file }}
        run: |
          [ "${OUTCOME}" = success ] || { echo "::error::the agent step failed (${OUTCOME})"; exit 1; }
          if [ ! -s "${EXEC:-/nonexistent}" ]; then
            echo "the agent step passed; Claude runs only from main's copy of this workflow"; exit 0
          fi
          err=$(jq -r '[.[] | select(.type == "result")] | last | .is_error' "${EXEC}")
          [ "${err}" = false ] || { echo "::error::the agent's run ended in an error"; exit 1; }
          echo "the agent started and answered"

      - name: Hand over
        if: always() && steps.claude.outcome != 'skipped' && matrix.mode != 'dry'
        env:
          # This job's token: the agent's was revoked when the agent step ended.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ matrix.issue }}
          MODE: ${{ matrix.mode }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          branch="claude/issue-${ISSUE}"
          gh issue edit "${ISSUE}" --remove-label agent-running >/dev/null || true
          # The agent never started (the action failed before Claude ran): not an attempt.
          if [ ! -s "${EXEC:-/nonexistent}" ]; then echo "the agent did not run"; exit 0; fi
          gh label create agent-attempted --color C5DEF5 --description "An agent worked on this" --force >/dev/null
          gh issue edit "${ISSUE}" --add-label agent-attempted >/dev/null || true
          # A usage limit is not the agent's failure: the next sweep takes it again.
          last=$(jq -r '[.[] | select(.type == "result")] | last | select(.is_error == true) | .result // ""' "${EXEC}" 2>/dev/null || true)
          if printf '%s' "${last}" | grep -qiE 'usage limit|limit reached|rate.limit'; then
            echo "stopped by a usage limit: ${last}"; exit 0
          fi
          if [ "${MODE}" = work ] && [ -s /tmp/agent-done.md ]; then
            { echo "**autofix: done.**"; echo; cat /tmp/agent-done.md; } > /tmp/note.md
            gh issue close "${ISSUE}" --comment "$(cat /tmp/note.md)"
            exit 0
          fi
          if [ "${MODE}" = ci-fix ]; then
            k=1; gh issue view "${ISSUE}" --json labels --jq '.labels[].name' | grep -qx agent-ci-fix-1 && k=2
            gh label create "agent-ci-fix-${k}" --color BFD4F2 --description "An agent tried to fix this PR's CI" --force >/dev/null
            gh issue edit "${ISSUE}" --add-label "agent-ci-fix-${k}" >/dev/null
            exit 0
          fi
          url=$(gh pr list --head "${branch}" --state open --json url --jq '.[0].url // empty')
          if [ -n "${url}" ]; then
            gh pr merge "${url}" --auto --rebase || echo "auto-merge not enabled"
            echo "pull request: ${url}"; exit 0
          fi
          # No pull request (a pushed branch without one counts too: the next agent opens it,
          # since a pull request opened with this job's token would start neither CI nor Guard).
          # No change at all. One retry (the next agent reads this note), then the owner.
          # Without a note of its own, the agent's last words say why (else nobody can tell).
          said=$(jq -r '[.[] | select(.type == "result")] | last | .result // ""' "${EXEC}" 2>/dev/null | head -c 3000 || true)
          {
            echo "**autofix: no change pushed.**"; echo
            if [ -s /tmp/agent-blocked.md ]; then cat /tmp/agent-blocked.md
            elif [ -n "${said}" ]; then echo "The agent stopped without a branch. Its last message:"; echo; printf '%s\n' "${said}" | sed 's/^/> /'
            else echo "The agent stopped without a branch."; fi
          } > /tmp/note.md
          gh issue comment "${ISSUE}" --body-file /tmp/note.md
          if gh issue view "${ISSUE}" --json labels --jq '.labels[].name' | grep -qx agent-retried; then
            gh label create needs-human --color D93F0B --description "Autofix could not finish: the owner decides" --force >/dev/null
            gh issue edit "${ISSUE}" --add-label needs-human
          else
            gh label create agent-retried --color BFD4F2 --description "Failed once; the next sweep retries" --force >/dev/null
            gh issue edit "${ISSUE}" --add-label agent-retried
          fi
