name: ci
on:
  # Branch pushes: not for changes to Markdown alone (README, PLAN, DEBUGGING):
  # nothing there is built or tested. Tags: only the named releases (v0.1.0,
  # v0.2.0...), which need the packages and the draft release. A patch tag
  # (v0.1.1, the daily ones) points at a commit main's CI has already tested.
  # (GitHub ignores paths for tags, and a push event with both filters runs
  # for a branch matching `branches` or a tag matching `tags`.)
  push:
    branches: ["**"]
    tags: ["v*.*.0"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

# A newer push to the same branch cancels the run before it (only the
# newest commit's result matters); a version tag's run is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Every job sets up with .github/actions/setup: the Odin release odinup.toml
# pins (prebuilt, by setup-odin), then the build driver (which fetches the
# pinned shader compiler itself).

jobs:
  # macOS and Windows: everything but the Linux-only checks, which the two
  # Linux jobs below run in parallel (the Linux job alone was CI's length).
  build:
    name: Test · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macOS arm64 }
          - { os: windows-latest, name: Windows x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          dev: true

      - name: Check
        run: ${{ runner.os == 'Windows' && '.\build.bat' || './build.sh' }} check
      - name: Test
        run: ${{ runner.os == 'Windows' && '.\build.bat' || './build.sh' }} test
      # The scripted 10 000-tick session at both optimization levels (M38):
      # the logs go to the determinism job below, which compares all six.
      - name: Determinism
        run: ${{ runner.os == 'Windows' && '.\build.bat' || './build.sh' }} determinism
      - name: Determinism logs
        uses: actions/upload-artifact@v7
        with:
          name: determinism-${{ matrix.os }}
          path: build/determinism/
          if-no-files-found: error
      - name: Build game
        run: ${{ runner.os == 'Windows' && '.\build.bat' || './build.sh' }} build
      # The chunk pipeline (M19): exact counts, and every stage within a
      # generous budget (an optimized build, one thread).
      - name: Benchmark check
        run: ${{ runner.os == 'Windows' && '.\build.bat' || './build.sh' }} bench chunks -check
      # The server's benchmark scenario, short (M19): simulated players over
      # UDP on every platform; its numbers compare with nothing.
      - name: Server benchmark (smoke)
        run: ${{ runner.os == 'Windows' && '.\build\voxiverse-server.exe' || './build/voxiverse-server' }} --benchmark server --smoke

  # Linux, the tests: no window, nothing but the compiler. Runs beside
  # "Game · Linux x64", which needs the apt packages and a built game.
  linux-tests:
    name: Test · Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          dev: true

      - name: Check
        run: ./build.sh check
      # A virtual gamepad for the platform package's hot-plug test (M41): the
      # uinput device writable, and the pad's event node readable by the
      # runner user. VX_REQUIRE_UINPUT makes the test fail rather than skip.
      - name: Virtual gamepad
        run: |
          sudo modprobe uinput
          sudo chmod 0666 /dev/uinput
          echo 'SUBSYSTEM=="input", KERNEL=="event*", ATTRS{id/vendor}=="1209", ATTRS{id/product}=="0001", MODE="0666"' | sudo tee /etc/udev/rules.d/99-voxiverse-test.rules
          sudo udevadm control --reload-rules
          echo "VX_REQUIRE_UINPUT=1" >> "$GITHUB_ENV"
      # One run of the suite per push, with a random seed that changes with
      # the push (M29: a test that passes under one seed and fails under
      # another is a flake or a nondeterminism, and fails the run; the tests'
      # worlds are still: game.rules_still). The seed is the run number: a
      # re-run of the same run uses the same seed, so a failure that depends
      # on it fails again rather than passing as a flake. It is printed
      # first, and again if the tests fail (set it to reproduce).
      - name: Test
        env:
          ODIN_TEST_RANDOM_SEED: ${{ github.run_number }}
        run: |
          echo "ODIN_TEST_RANDOM_SEED=$ODIN_TEST_RANDOM_SEED"
          ./build.sh test || { echo "::error::tests failed with ODIN_TEST_RANDOM_SEED=$ODIN_TEST_RANDOM_SEED"; exit 1; }
      # The scripted 10 000-tick session at both optimization levels (M38):
      # the logs go to the determinism job below, which compares all six.
      - name: Determinism
        run: ./build.sh determinism
      - name: Determinism logs
        uses: actions/upload-artifact@v7
        with:
          name: determinism-ubuntu-latest
          path: build/determinism/
          if-no-files-found: error
      # The optimized tests, one build: M46 the save killed at 1000 different
      # operations (a faulty disk layer, not real kills: every point loads,
      # and is exactly the old generation or the new one); M11 10 000 blocks
      # of water flowing within the server's tick; M45 the edit journal's
      # cost, a share of the ticks' time and a mean per tick. (The unit
      # tests are unoptimized, with more slack.) The save budget (M46b: what
      # a save costs the tick with 200 characters, 512 edited chunks, 100
      # chests and 400 entities; the budgets are the runner's) is in the same
      # run. One test at a time, as a define (the runner reads no environment
      # variable): by default it runs the tests on several threads at once,
      # and a server saving 512 chunks next to one flooding 10 000 blocks
      # of water costs the flood its tick budget (#26). Run one after the
      # other, nothing outlives a test: no thread, the same memory.
      - name: Optimized tests
        run: odin test server -o:speed -vet -strict-style -define:ODIN_TEST_THREADS=1 -define:ODIN_TEST_NAMES=server.test_save_survives_crashes,server.test_water_flood,server.test_journal_cost,server.test_save_200_characters,server.test_audit_budget -define:VX_CRASH_POINTS=1000 -out:build/optimized_test
      # Telemetry's cost (M26, M29): an event is a lock and a copy, and the
      # writer keeps up; optimized, with budgets for a slow runner.
      - name: Event cost, optimized
        run: odin test common/telemetry -o:speed -vet -strict-style -define:ODIN_TEST_NAMES=telemetry.test_event_cost -out:build/cost_test

  # Linux, the game and the tools: real frames on Mesa's CPU Vulkan driver
  # under the validation layer, any validation finding, leak, sanitizer
  # report or failed check fails the run.
  linux-game:
    name: Game · Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Linux test packages (CPU Vulkan, xvfb, debuggers, tshark)
        uses: ./.github/actions/apt
        with:
          packages: xvfb mesa-vulkan-drivers vulkan-validationlayers gdb lldb tshark lua5.4
      - name: CPU Vulkan driver
        run: echo "VK_DRIVER_FILES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n 1)" >> "$GITHUB_ENV"

      - name: Build game
        run: ./build.sh build
      # The chunk pipeline (M19): exact counts, and every stage within a
      # generous budget (an optimized build, one thread).
      - name: Benchmark check
        run: ./build.sh bench chunks -check
      # The server's benchmark scenario, short (M19): simulated players over
      # UDP; its numbers compare with nothing.
      - name: Server benchmark (smoke)
        run: ./build/voxiverse-server --benchmark server --smoke

      # The world streams through a flight and memory stays flat (fly_test,
      # M3's check), recorded: every message decodes, and replaying the
      # client's messages against a fresh server goes cleanly.
      - name: Flight, trace and replay
        run: |
          xvfb-run -a ./build/voxiverse --frames 120
          xvfb-run -a ./build/voxiverse --exec "set debug.net_trace 1; set debug.net_latency_ms 30" --check fly
          ./build.sh netdump -summary
          ./build.sh replay -speed:2

      # The same flight on a synthetic gamepad (M41): events in, the actions,
      # the predicted inputs out.
      - name: Gamepad flight
        run: xvfb-run -a ./build/voxiverse --check fly_pad

      # Bulk edits (M9): rockets and explosions, each shown whole, and the
      # client's chunks end up exactly the server's.
      - name: Blast test
        run: xvfb-run -a ./build/voxiverse --check blast

      # Worldgen (M10): every biome visited, screenshotted (uploaded below),
      # within frame, generation and meshing budgets, memory flat.
      - name: Biome tour
        run: xvfb-run -a ./build/voxiverse --check tour

      # The game's benchmark scenarios, short (M19): each still runs to its
      # end (fixed conditions, offscreen drawing, its result written) on the
      # CPU driver under validation; timing here means nothing.
      - name: Benchmark scenarios (smoke)
        run: |
          for scenario in load views flight edits audio; do
            xvfb-run -a ./build/voxiverse --benchmark $scenario --smoke
          done

      # Real-time audio (M32d): 30 s of a busy session mixed into the null
      # device; no underruns, non-finite samples, dropped or late commands,
      # the callback within its budget, the rolling capture written.
      - name: Audio smoke run
        run: xvfb-run -a ./build/voxiverse --check audio

      # Every screen a player meets (M20), screenshotted (uploaded below):
      # the menus and Options' tabs, the loading screen, a failed join.
      - name: Screens
        run: |
          xvfb-run -a ./build/voxiverse --exec "set name ci; sleep 2; screenshot screen_title; wait 3; screen worlds; wait 3; screenshot screen_saves; wait 3; screen worlds create; wait 3; screenshot screen_create_save; wait 3; screen multiplayer; sleep 1; screenshot screen_multiplayer; wait 3; screen multiplayer direct; wait 3; screenshot screen_direct_connection; wait 3; screen options video; wait 3; screenshot screen_options_video; wait 3; screen options sound; wait 3; screenshot screen_options_sound; wait 3; screen options controls; wait 3; screenshot screen_options_controls; wait 3; screen options accessibility; wait 3; screenshot screen_options_accessibility; wait 3; screen options profile; wait 3; screenshot screen_options_profile; wait 3; screen credits; wait 3; screenshot screen_credits; wait 3; screen title; screen quit; wait 3; screenshot screen_quit; wait 3; quit"
          xvfb-run -a ./build/voxiverse --exec "set render_distance 4; singleplayer; wait 20; screenshot screen_loading; wait_world; screen menu; wait 3; screenshot screen_game_menu; wait 3; screen game; /give Player cap; /give Player tunic; /give Player trousers; /give Player boots; wait 5; /wear; wait 5; screen inventory; wait 3; screenshot screen_inventory; wait 3; screen game; screen inventory creative; wait 3; screenshot screen_creative; wait 3; screen game; screen stats; wait 3; screenshot screen_stats; wait 3; quit"
          xvfb-run -a ./build/voxiverse --exec "set name ci; join 127.0.0.1:1; sleep 12; screenshot screen_failed; wait 3; quit"
          xvfb-run -a ./build/voxiverse --exec "set name ci; pad connect xbox; pad dpad_down down; pad dpad_down up; wait 3; screenshot screen_title_pad; screen options controls; wait 3; screenshot screen_options_pad; screen worlds create; pad a down; pad a up; wait 3; screenshot screen_keyboard; quit"

      # The sky through a day (screenshots uploaded below).
      - name: Sky
        run: xvfb-run -a ./build/voxiverse --exec "set render_distance 4; singleplayer; wait_world; set rules.daylight_cycle 0; /tp 0 12 0 -90 8; wait 30; /time 0.26; wait 5; screenshot sky_sunrise; /tp 0 12 0 -90 50; /time 0.4; wait 5; screenshot sky_day; /tp 0 12 0 90 8; /time 0.77; wait 5; screenshot sky_dusk; /tp 0 12 0 -90 20; /time 0.8; wait 5; screenshot sky_night; wait 5; quit"

      # Over real sockets: a dedicated server and a client joining it, the
      # server capturing every packet; the Wireshark dissector must decode
      # them all (our harness, then tshark itself).
      - name: Multiplayer and Wireshark
        run: |
          ./build/voxiverse-server --universe build/ci-universe --view-radius 3 --view-height 2 --capture build/server.pcap > build/server.log 2>&1 &
          SERVER=$!
          for _ in $(seq 100); do grep -q "server listening" build/server.log && break; sleep 0.1; done
          grep "server listening" build/server.log
          xvfb-run -a ./build/voxiverse --exec "set name ci; set render_distance 3; join 127.0.0.1; wait_world; wait 30; screenshot multiplayer; wait 5; quit"
          kill -INT $SERVER
          wait $SERVER
          lua5.4 tools/wireshark/check.lua build/server.pcap
          tshark -X lua_script:tools/wireshark/voxiverse.lua -r build/server.pcap -Y voxiverse > build/tshark.txt
          head -n 20 build/tshark.txt
          test "$(wc -l < build/tshark.txt)" -gt 50
          test -z "$(tshark -X lua_script:tools/wireshark/voxiverse.lua -r build/server.pcap -Y '_ws.malformed || voxiverse.malformed')"

      # A crash is reported with our stack, and still fails the run.
      - name: Crash handler
        run: |
          if xvfb-run -a ./build/voxiverse --exec crash > build/crash.txt 2>&1; then echo "crash did not crash"; exit 1; fi
          grep 'crash signal=SIGSEGV' build/crash.txt && grep 'at client::console_execute' build/crash.txt

      - name: AddressSanitizer
        run: |
          ./build.sh build --sanitize
          ASAN_OPTIONS=detect_leaks=0 xvfb-run -a ./build/voxiverse --frames 60
          ASAN_OPTIONS=detect_leaks=0 xvfb-run -a ./build/voxiverse --check fly

      # A release build's flight, profiled: the trace must be well formed.
      - name: Profiling
        run: |
          ./build.sh build --release --profile
          xvfb-run -a ./build/voxiverse --check fly
          python3 tools/debugger/check_spall.py build/voxiverse.spall
          # The optimized build's chunk budgets (tighter than a debug build's).
          xvfb-run -a ./build/voxiverse --check tour

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: build/screenshots/
          if-no-files-found: ignore

      - name: Debugger printers
        run: tools/debugger/test_printers.sh
  # The same session's state hashes, from every OS at both optimization levels
  # (M38), must agree line by line: a divergence is named by tick and section.
  determinism:
    name: Determinism · all OSes
    needs: [build, linux-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          pattern: determinism-*
          path: build/determinism
          merge-multiple: true
      - name: Compare
        run: ./build.sh determinism --compare build/determinism

  # Release packages (docs/plan.md, M21): one per platform, from every push (kept
  # as workflow artifacts, for testers), each unpacked on its own and run
  # from there: nothing beside it is needed. macOS waits for its backend
  # (M1b). Linux builds on the oldest supported Ubuntu, so the game runs on
  # older distributions (glibc).
  package:
    name: Package · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: Linux x64 }
          - { os: windows-latest, name: Windows x64 }
          - { os: macos-latest, name: macOS arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags: the version comes from them
      # Checkout fetches a pushed tag as a plain ref; its message (the
      # release's name) needs the tag object itself.
      - name: Tags
        shell: bash
        run: git fetch --force --tags origin

      - uses: ./.github/actions/setup

      - name: Package
        run: ${{ runner.os == 'Windows' && '.\build.bat' || './build.sh' }} package

      - name: Packages to run it (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt
        with:
          packages: xvfb mesa-vulkan-drivers

      - name: Run the package (Linux)
        if: runner.os == 'Linux'
        run: |
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n 1)"
          export VX_SAVES="$RUNNER_TEMP/saves" VX_SETTINGS="$RUNNER_TEMP/settings.cfg"
          tar -xzf build/dist/*.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/voxiverse-*-linux-x64
          ./voxiverse --version
          ./voxiverse-server --version
          ./voxiverse-server --universe "$RUNNER_TEMP/universe" --seconds 5
          timeout 600 xvfb-run -a ./voxiverse --exec "set render_distance 4; singleplayer; wait_world; screenshot package; wait 3; quit"
          ls screenshots/package.png

      - name: Run the package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = (Get-Item build\dist\*.zip).FullName
          $top = [IO.Path]::GetFileNameWithoutExtension($zip)
          # The paths as stored: all in the one folder of the zip's name;
          # never "./" (Explorer then shows an empty zip that will not
          # extract), "/" or "..".
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          $entries = $archive.Entries.FullName
          $archive.Dispose()
          $entries
          $bad = $entries | Where-Object { -not $_.StartsWith("$top/") -or $_ -match '(^|/)\.\.?(/|$)' }
          if ($bad) { "bad paths: $bad"; exit 1 }
          # As Explorer sees it (its own zip support): that one folder.
          $items = (New-Object -ComObject Shell.Application).NameSpace($zip).Items()
          if ($items.Count -ne 1 -or $items.Item(0).Name -ne $top) { "Explorer sees $($items.Count) items"; exit 1 }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\package"
          Set-Location "$env:RUNNER_TEMP\package\$top"
          .\voxiverse-server.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\voxiverse-server.exe --universe "$env:RUNNER_TEMP\universe" --seconds 5
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The game is a windowed program: PowerShell would not wait for it.
          $game = Start-Process .\voxiverse.exe -ArgumentList "--version" -Wait -PassThru
          if ($game.ExitCode -ne 0) { exit 1 }
          # The version information linked in (the file's Details tab).
          $info = (Get-Item .\voxiverse.exe).VersionInfo
          $info | Format-List ProductName, ProductVersion, FileDescription, FileVersion
          if ($info.ProductName -ne "Voxiverse") { exit 1 }

      # Not run: no window server or GPU here. Unpacked as a user would, its
      # bundle checked and both programs asked for their version.
      - name: Check the package (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -x -k build/dist/*.zip "$RUNNER_TEMP/package"
          cd "$RUNNER_TEMP"/package/voxiverse-*-macos-arm64
          ls -l
          plutil -lint Voxiverse.app/Contents/Info.plist
          codesign --verify --deep --strict Voxiverse.app
          codesign --verify --strict voxiverse-server
          test -f Voxiverse.app/Contents/Frameworks/libMoltenVK.dylib
          test -f Voxiverse.app/Contents/Resources/Voxiverse.icns
          ./voxiverse-server --version
          Voxiverse.app/Contents/MacOS/voxiverse --version

      # The package itself, not zipped again: the artifact is the file, by
      # its own name.
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          path: build/dist/voxiverse-*.${{ runner.os == 'Linux' && 'tar.gz' || 'zip' }}
          archive: false
          retention-days: 30
          if-no-files-found: error

  # A minor version tag (v0.1.0, a named playtest build) makes a draft GitHub
  # Release with the packages and their checksums: nothing is public until it
  # is looked at and published by hand. The tag's message is the release's
  # name. Patch tags (v0.1.1, the daily ones) make no release.
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '.0')
    needs: [build, linux-tests, linux-game, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the history: the notes list the commits since the last tag
      - name: Tags
        run: git fetch --force --tags origin
      # The packages as files (a zip is not unpacked).
      - uses: actions/download-artifact@v8
        with:
          pattern: voxiverse-*
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          NAME="$(git for-each-ref --format='%(objecttype) %(contents:subject)' "refs/tags/$TAG")"
          case "$NAME" in
            "tag $TAG" | "tag $VERSION" | "commit "*) TITLE="Voxiverse $VERSION" ;;
            *) TITLE="Voxiverse ${NAME#tag } ($VERSION)" ;;
          esac
          cd dist
          ls -l
          # Exactly the three packages, as files, for this version.
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          test -f "voxiverse-$VERSION-windows-x64.zip"
          test -f "voxiverse-$VERSION-linux-x64.tar.gz"
          test -f "voxiverse-$VERSION-macos-arm64.zip"
          sha256sum * > SHA256SUMS
          # The notes: the milestones done since the previous x.y.0 tag (or
          # since the start), from the commit subjects, to be edited.
          PREV="$(git tag --list 'v*.*.0' --sort=-v:refname | grep -vx "$TAG" | while read -r t; do
            if git merge-base --is-ancestor "$t" "$TAG"; then echo "$t"; break; fi
          done)"
          RANGE="${PREV:+$PREV..}$TAG"
          LIST="$(git log --reverse --format=%s "$RANGE" | grep -E '^M[0-9]+[a-z]*: ' | awk '!seen[$0]++ {print "- " $0}' || true)"
          # The first x.y.0 tag runs from the start: keep the 40 newest.
          if [ -z "$PREV" ]; then
            COUNT="$(printf '%s\n' "$LIST" | grep -c '^- ' || true)"
            if [ "$COUNT" -gt 40 ]; then
              LIST="$(printf '%s\n' "$LIST" | tail -n 40)"$'\n'"- …and $((COUNT - 40)) earlier milestones"
            fi
          fi
          {
            echo "## What's in it"
            echo
            echo "${LIST:-- (no milestone commits)}"
            echo
            echo "## Downloads"
            echo
            echo "- Windows (64-bit): the .zip. Windows may warn about an unknown publisher (not code-signed yet): More info, Run anyway."
            echo "- Linux (64-bit): the .tar.gz. Needs a Vulkan 1.3 driver."
            echo "- macOS (Apple Silicon): the .zip. macOS asks you to confirm opening an app that is not from the App Store: see README.txt."
            echo
            echo "Will it run on your computer, and what to include in a report: https://github.com/voxiverse/voxiverse/blob/main/docs/platforms.md"
            echo
            echo "README.txt inside says where settings and saves are kept. SHA256SUMS lists each file's checksum."
          } > ../notes.md
          gh release create "$TAG" --draft --prerelease --verify-tag --title "$TITLE" --notes-file ../notes.md *
