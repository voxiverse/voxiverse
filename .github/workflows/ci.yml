name: ci
on:
  # Pushes to main, and every version tag (v*.*.*), which builds the packages and drafts a
  # release (it usually points at a commit main's CI has already tested). Other branches are
  # tested by their pull request's run: a push run as well ran everything twice.
  # (A push event with both filters runs for a branch matching `branches` or a tag matching
  # `tags`.)
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run before it (only the
# newest commit's result matters); a version tag's run is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# CI builds every Tier 1 target natively in its own job, so `check` skips its
# cross-target object builds here (VX_CI); locally they stay.
env:
  VX_CI: "1"

# Every job sets up with .github/actions/setup: the Odin release odinup.toml
# pins (prebuilt, by setup-odin), then the build driver (which fetches the
# pinned shader compiler itself).

jobs:
  # Whether this run has anything left to test. A version tag on a commit whose
  # push run on main passed has been tested: its test jobs are skipped and only
  # the packages, their checks and the draft release run. A tag on any other
  # commit, every push to main and every pull request run everything.
  gate:
    name: Tested on main?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      tested: ${{ steps.green.outputs.tested }}
      code: ${{ steps.changes.outputs.code }}
    steps:
      # Markdown-only changes skip the build and test jobs (they used to skip the whole
      # workflow, but then the required "CI result" check would never report).
      - name: Anything but Markdown changed?
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=""
          if [ -n "${PR}" ]; then
            files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename')"
          elif [ "${GITHUB_REF_TYPE}" = branch ] && [ -n "${BEFORE}" ] && [ "${BEFORE}" != 0000000000000000000000000000000000000000 ]; then
            files="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${GITHUB_SHA}" --jq '.files[].filename')" || files=""
          fi
          code=true
          if [ -n "${files}" ] && ! printf '%s\n' "${files}" | grep -qvE '\.md$'; then code=false; fi
          echo "code changed: ${code}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"

      - name: Green push run on main for this commit
        id: green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested=false
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=main&event=push&status=success&per_page=1" --jq .total_count)"
            echo "successful push runs on main for ${GITHUB_SHA}: ${count}"
            [ "${count}" -gt 0 ] && tested=true
          fi
          echo "tested=${tested}" >> "$GITHUB_OUTPUT"

  # macOS and Windows: everything but the Linux-only checks, which the two
  # Linux jobs below run in parallel (the Linux job alone was CI's length).
  build:
    name: Test · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macOS arm64 }
          - { os: windows-latest, name: Windows x64 }
    needs: gate
    if: ${{ needs.gate.outputs.tested != 'true' && needs.gate.outputs.code == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          dev: true

      - name: Check
        if: ${{ !cancelled() }}
        run: ${{ runner.os == 'Windows' && '.\build.bat' || './build.sh' }} check
      - name: Test
        if: ${{ !cancelled() }}
        run: ${{ runner.os == 'Windows' && '.\build.bat' || './build.sh' }} test
      # The packages' own output, kept when a test failed (the report shows the first error line; the rest is here).
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.os }}
          path: build/test/*.log
          if-no-files-found: ignore
      # macOS crash reports (.ips) for a test binary that died with a signal and no message.
      - name: Crash reports
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: crash-reports-${{ matrix.os }}
          path: ~/Library/Logs/DiagnosticReports/*.ips
          if-no-files-found: ignore
      # The scripted 10 000-tick session at both optimization levels:
      # the logs go to the determinism job below, which compares all six.
      - name: Determinism
        if: ${{ !cancelled() }}
        run: ${{ runner.os == 'Windows' && '.\build.bat' || './build.sh' }} determinism
      - name: Determinism logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: determinism-${{ matrix.os }}
          path: build/determinism/
          if-no-files-found: ignore # the comparison job fails on a missing log
      # What needs real threads, sockets, audio devices and child processes
      # (on macOS also the window's buttons against a real AppKit window).
      - name: Smoke
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        timeout-minutes: 15 # a hang fails this step; it once starved the runner for 50 minutes
        run: ${{ runner.os == 'Windows' && '.\build.bat' || './build.sh' }} smoke
      - name: Build game
        id: build
        if: ${{ !cancelled() }}
        run: ${{ runner.os == 'Windows' && '.\build.bat' || './build.sh' }} build
      # The chunk pipeline: exact counts, and every stage within a
      # generous budget (an optimized build, one thread).
      - name: Benchmark check
        if: ${{ !cancelled() }}
        run: ${{ runner.os == 'Windows' && '.\build.bat' || './build.sh' }} bench chunks -check
      # Telemetry's cost: an event is a lock and a copy, and the
      # writer keeps up; budgets for a slow runner.
      - name: Benchmark check, telemetry
        if: ${{ !cancelled() }}
        run: ${{ runner.os == 'Windows' && '.\build.bat' || './build.sh' }} bench telemetry -check
      # What the server's heavy work costs (the budgets the tests held: a
      # save, the audit, counters, the journal, 10 000 blocks of water); CPU
      # time on this thread, budgets for a slow runner.
      # A miss is confirmed by a second check (docs/benchmarking.md): a slow runner moves every
      # run of the first, and so its median; a real regression fails both.
      - name: Benchmark check, budgets
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $build = if ($IsWindows) { '.\build.bat' } else { './build.sh' }
          & $build bench budgets -check
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning::over budget once, checking again"
            & $build bench budgets -check
          }
          exit $LASTEXITCODE
      # The script VM's benchmark programs: each one's instruction units within
      # its budget (exact counts, the same on every OS; one repetition, as the times
      # judge nothing here: the ratios to Lua are checked on Linux).
      - name: Benchmark check, script
        if: ${{ !cancelled() }}
        run: ${{ runner.os == 'Windows' && '.\build.bat' || './build.sh' }} bench script -check --smoke
      # The server's benchmark scenario, short: simulated players over
      # UDP on every platform; its numbers compare with nothing.
      - name: Server benchmark (smoke)
        if: ${{ !cancelled() }}
        run: ${{ runner.os == 'Windows' && '.\build\voxiverse-server.exe' || './build/voxiverse-server' }} --benchmark server --smoke
      # Each test's time and result and each budget's median and runs (docs/debugging.md).
      - name: Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.os == 'macos-latest' && 'macos' || 'windows' }}
          path: build/reports/
          if-no-files-found: ignore

  # Linux, the tests: no window, nothing but the compiler. Runs beside
  # the two "Game · Linux x64" jobs, which need the apt packages and a built game.
  linux-tests:
    name: Test · Linux x64
    needs: gate
    if: ${{ needs.gate.outputs.tested != 'true' && needs.gate.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          dev: true

      - name: Check
        if: ${{ !cancelled() }}
        run: ./build.sh check
      # A virtual gamepad for the platform package's hot-plug test: the
      # uinput device writable, and the pad's event node readable by the
      # runner user. VX_REQUIRE_UINPUT makes the test fail rather than skip.
      - name: Virtual gamepad
        if: ${{ !cancelled() }}
        run: |
          sudo modprobe uinput
          sudo chmod 0666 /dev/uinput
          echo 'SUBSYSTEM=="input", KERNEL=="event*", ATTRS{id/vendor}=="1209", ATTRS{id/product}=="0001", MODE="0666"' | sudo tee /etc/udev/rules.d/99-voxiverse-test.rules
          sudo udevadm control --reload-rules
          echo "VX_REQUIRE_UINPUT=1" >> "$GITHUB_ENV"
      # One run of the suite per push, with a random seed that changes with
      # the push (a test that passes under one seed and fails under
      # another is a flake or a nondeterminism, and fails the run; the tests'
      # worlds are still: game.rules_still). The seed is the run number: a
      # re-run of the same run uses the same seed, so a failure that depends
      # on it fails again rather than passing as a flake. It is printed
      # first, and again if the tests fail (set it to reproduce).
      - name: Test
        if: ${{ !cancelled() }}
        env:
          ODIN_TEST_RANDOM_SEED: ${{ github.run_number }}
        run: |
          echo "ODIN_TEST_RANDOM_SEED=$ODIN_TEST_RANDOM_SEED"
          ./build.sh test || { echo "::error::tests failed with ODIN_TEST_RANDOM_SEED=$ODIN_TEST_RANDOM_SEED"; exit 1; }
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-ubuntu-latest
          path: build/test/*.log
          if-no-files-found: ignore
      # Every parser of untrusted input, 2 000 cases each at the fixed seed 84 (a push never
      # fails on a seed nobody has seen: the nightly run takes others), then the regression
      # files of every crash found (docs/fuzzing.md).
      - name: Fuzz (smoke)
        if: ${{ !cancelled() }}
        run: ./build.sh fuzz --smoke
      # The scripted 10 000-tick session at both optimization levels:
      # the logs go to the determinism job below, which compares all six.
      - name: Determinism
        if: ${{ !cancelled() }}
        run: ./build.sh determinism
      - name: Determinism logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: determinism-ubuntu-latest
          path: build/determinism/
          if-no-files-found: ignore # the comparison job fails on a missing log
      # The smoke suite: what needs a real thread, socket, audio device,
      # child process or clock, one test at a time. Here, not in the game job,
      # because the virtual gamepad above is set up here and the game job is
      # the longest.
      - name: Smoke
        if: ${{ !cancelled() }}
        run: ./build.sh smoke
      # Each test's time and result and each budget's median and runs (docs/debugging.md).
      - name: Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-linux
          path: build/reports/
          if-no-files-found: ignore

  # Linux, the game and the tools, the scenario checks: real frames on Mesa's CPU
  # Vulkan driver under the validation layer; any validation finding, leak or
  # failed check fails the run. Runs beside "Game · Linux x64, images", which has
  # the visual baselines, AddressSanitizer, profiling and the screenshots.
  linux-game:
    name: Game · Linux x64
    needs: gate
    if: ${{ needs.gate.outputs.tested != 'true' && needs.gate.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Linux test packages (CPU Vulkan, xvfb, debuggers, tshark)
        uses: ./.github/actions/apt
        with:
          packages: xvfb mesa-vulkan-drivers vulkan-validationlayers gdb lldb tshark lua5.4
      - name: CPU Vulkan driver
        run: echo "VK_DRIVER_FILES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n 1)" >> "$GITHUB_ENV"

      - name: Build game
        id: build
        if: ${{ !cancelled() }}
        run: ./build.sh build
      # The chunk pipeline: exact counts, and every stage within a
      # generous budget (an optimized build, one thread).
      - name: Benchmark check
        if: ${{ !cancelled() }}
        run: ./build.sh bench chunks -check
      - name: Benchmark check, telemetry
        if: ${{ !cancelled() }}
        run: ./build.sh bench telemetry -check
      # A miss is confirmed by a second check, as on the other OSes.
      - name: Benchmark check, budgets
        if: ${{ !cancelled() }}
        run: |
          ./build.sh bench budgets -check || {
            echo "::warning::over budget once, checking again"
            ./build.sh bench budgets -check
          }
      # The script VM against PUC Lua 5.4 (installed above): each benchmark program
      # at most 4x Lua's CPU time and 2.5x in geometric mean (ratios on this runner, so
      # its speed cancels), the instruction budgets, and every `--! lua` conformance
      # file printing the same under both.
      - name: Benchmark check, script
        if: ${{ !cancelled() }}
        run: ./build.sh bench script -check --lua lua5.4
      # The script fuzzer's generated programs run by PUC Lua 5.4 too: 2 000 at the
      # fixed seed 51, each printing the same under both (docs/fuzzing.md).
      - name: Fuzz (smoke), script programs against Lua
        if: ${{ !cancelled() }}
        run: ./build.sh fuzz script.generated --cases 2000 --seed 51 -- --lua lua5.4
      # The server's benchmark scenario, short: simulated players over
      # UDP; its numbers compare with nothing.
      - name: Server benchmark (smoke)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./build/voxiverse-server --benchmark server --smoke
      # Each test's time and result and each budget's median and runs (docs/debugging.md).
      - name: Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-linux-game
          path: build/reports/
          if-no-files-found: ignore

      # The world streams through a flight and memory stays flat (fly_test,
      # the check), recorded: every message decodes, and replaying the
      # client's messages against a fresh server goes cleanly.
      - name: Flight, trace and replay
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          xvfb-run -a ./build/voxiverse --frames 120
          xvfb-run -a ./build/voxiverse --exec "set debug.net_trace 1; set debug.net_latency_ms 30" --check fly
          ./build.sh netdump -summary
          ./build.sh replay -speed:2

      # The same flight on a synthetic gamepad: events in, the actions,
      # the predicted inputs out.
      - name: Gamepad flight
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run -a ./build/voxiverse --check fly_pad

      # GPU culling: the culling shader's commands, for fixed chunks and
      # cameras, exactly the CPU's rules' (lavapipe).
      - name: Culling check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run -a ./build/voxiverse --check cull

      # The depth pyramid and the occlusion test: every level of the
      # pyramid bit-exact against the CPU's, every verdict equal (lavapipe).
      - name: Depth pyramid check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run -a ./build/voxiverse --check hiz

      # Bulk edits: rockets and explosions, each shown whole, and the
      # client's chunks end up exactly the server's.
      - name: Blast test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run -a ./build/voxiverse --check blast

      # Worldgen: every biome visited, screenshotted (uploaded below as screenshots-scenarios),
      # within frame, generation and meshing budgets, memory flat.
      - name: Biome tour
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run -a ./build/voxiverse --check tour

      # The game's benchmark scenarios, short: each still runs to its
      # end (fixed conditions, offscreen drawing, its result written) on the
      # CPU driver under validation; timing here means nothing.
      - name: Benchmark scenarios (smoke)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          for scenario in load views flight edits audio viewmodel; do
            xvfb-run -a ./build/voxiverse --benchmark $scenario --smoke
          done

      # Real-time audio: 30 s of a busy session mixed into the null
      # device; no underruns, non-finite samples, dropped or late commands,
      # the callback within its budget, the rolling capture written.
      - name: Audio smoke run
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run -a ./build/voxiverse --check audio

      # Over real sockets: a dedicated server and a client joining it, the
      # server capturing every packet; the Wireshark dissector must decode
      # them all (our harness, then tshark itself).
      - name: Multiplayer and Wireshark
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          ./build/voxiverse-server --universe build/ci-universe --view-radius 3 --view-height 2 --capture build/server.pcap > build/server.log 2>&1 &
          SERVER=$!
          for _ in $(seq 100); do grep -q "server listening" build/server.log && break; sleep 0.1; done
          grep "server listening" build/server.log
          xvfb-run -a ./build/voxiverse --exec "set name ci; set render_distance 3; join 127.0.0.1; wait_world; wait 30; screenshot multiplayer; wait 5; quit"
          kill -INT $SERVER
          wait $SERVER
          lua5.4 tools/wireshark/check.lua build/server.pcap
          tshark -X lua_script:tools/wireshark/voxiverse.lua -r build/server.pcap -Y voxiverse > build/tshark.txt
          head -n 20 build/tshark.txt
          test "$(wc -l < build/tshark.txt)" -gt 50
          test -z "$(tshark -X lua_script:tools/wireshark/voxiverse.lua -r build/server.pcap -Y '_ws.malformed || voxiverse.malformed')"

      # A crash is reported with our stack, and still fails the run.
      - name: Crash handler
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          rm -rf build/tmp/crash-home && mkdir -p build/tmp/crash-home
          if VX_SETTINGS=build/tmp/crash-home/settings.cfg xvfb-run -a ./build/voxiverse --exec crash > build/crash.txt 2>&1; then echo "crash did not crash"; exit 1; fi
          grep 'crash signal=SIGSEGV' build/crash.txt && grep 'at console::console_execute' build/crash.txt
          # The bundle: the signal, the main thread and another, the log and the actions.
          bundle=$(ls -d build/tmp/crash-home/crashes/*/ | tail -n 1)
          grep 'signal=SIGSEGV' "$bundle/crash.txt"
          grep 'thread main (crashing)' "$bundle/threads.txt" && grep '^thread audio' "$bundle/threads.txt"
          test -s "$bundle/log.txt" && grep 'command crash' "$bundle/actions.txt"

      - name: Debugger printers
        if: ${{ !cancelled() }}
        run: tools/debugger/test_printers.sh

      # The biome tour's and the multiplayer client's screenshots ("Screenshots" in the
      # images job has the screens, sky and held items).
      - name: Screenshots, scenarios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-scenarios
          path: build/screenshots/
          if-no-files-found: ignore

  # Linux, the game's pictures and instrumented builds: the visual baselines (their
  # scenes render in parallel), AddressSanitizer, profiling, and the screens, sky and
  # held items whose screenshots are uploaded. Runs beside "Game · Linux x64", which
  # has the scenario checks.
  linux-images:
    name: Game · Linux x64, images
    needs: gate
    if: ${{ needs.gate.outputs.tested != 'true' && needs.gate.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Linux test packages (CPU Vulkan, xvfb, debuggers, tshark)
        uses: ./.github/actions/apt
        with:
          packages: xvfb mesa-vulkan-drivers vulkan-validationlayers gdb lldb tshark lua5.4
      - name: CPU Vulkan driver
        run: echo "VK_DRIVER_FILES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n 1)" >> "$GITHUB_ENV"

      - name: Build game
        id: build
        if: ${{ !cancelled() }}
        run: ./build.sh build
      # Every screen a player meets, screenshotted (uploaded below):
      # the menus and Options' tabs, the loading screen, a failed join.
      - name: Screens
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          xvfb-run -a ./build/voxiverse --exec "set name ci; sleep 2; screenshot screen_title; wait 3; screen worlds; wait 3; screenshot screen_saves; wait 3; screen worlds create; wait 3; screenshot screen_create_save; wait 3; screen multiplayer; sleep 1; screenshot screen_multiplayer; wait 3; screen multiplayer direct; wait 3; screenshot screen_direct_connection; wait 3; screen options video; wait 3; screenshot screen_options_video; wait 3; screen options sound; wait 3; screenshot screen_options_sound; wait 3; screen options controls; wait 3; screenshot screen_options_controls; wait 3; screen options accessibility; wait 3; screenshot screen_options_accessibility; wait 3; screen options profile; wait 3; screenshot screen_options_profile; wait 3; screen credits; wait 3; screenshot screen_credits; wait 3; screen title; screen quit; wait 3; screenshot screen_quit; wait 3; quit"
          xvfb-run -a ./build/voxiverse --exec "set render_distance 4; singleplayer; wait 20; screenshot screen_loading; wait_world; screen menu; wait 3; screenshot screen_game_menu; wait 3; screen game; /give Player cap; /give Player tunic; /give Player trousers; /give Player boots; wait 5; /wear; wait 5; screen inventory; wait 3; screenshot screen_inventory; wait 3; screen game; screen inventory creative; wait 3; screenshot screen_creative; wait 3; screen game; screen stats; wait 3; screenshot screen_stats; wait 3; quit"
          xvfb-run -a ./build/voxiverse --exec "set name ci; join 127.0.0.1:1; sleep 12; screenshot screen_failed; wait 3; quit"
          xvfb-run -a ./build/voxiverse --exec "set name ci; pad connect xbox; pad dpad_down down; pad dpad_down up; wait 3; screenshot screen_title_pad; screen options controls; wait 3; screenshot screen_options_pad; screen worlds create; pad a down; pad a up; wait 3; screenshot screen_keyboard; quit"

      # The sky through a day (screenshots uploaded below).
      - name: Sky
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run -a ./build/voxiverse --exec "set render_distance 4; singleplayer; wait_world; set rules.daylight_cycle 0; /tp 0 12 0 -90 8; wait 30; /time 0.26; wait 5; screenshot sky_sunrise; /tp 0 12 0 -90 50; /time 0.4; wait 5; screenshot sky_day; /tp 0 12 0 90 8; /time 0.77; wait 5; screenshot sky_dusk; /tp 0 12 0 -90 20; /time 0.8; wait 5; screenshot sky_night; wait 5; quit"

      # What the hands hold: each weapon, a block, a shaped block and a flat
      # item, seen in first person and from the side in third (screenshots
      # uploaded below, for the owner's review of the models).
      - name: Held items
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run -a ./build/voxiverse --exec "set name ci; set vsync false; set render_distance 4; singleplayer; wait_world; sleep 1; /clear ci; sleep 1; /give ci pistol; sleep 1; hold pistol; camera first; sleep 1; screenshot held_pistol_first; camera behind 90; sleep 1; screenshot held_pistol_third; sleep 1; /clear ci; sleep 1; /give ci rifle; sleep 1; hold rifle; camera first; sleep 1; screenshot held_rifle_first; camera behind 90; sleep 1; screenshot held_rifle_third; sleep 1; /clear ci; sleep 1; /give ci sniper; sleep 1; hold sniper; camera first; sleep 1; screenshot held_sniper_first; camera behind 90; sleep 1; screenshot held_sniper_third; sleep 1; /clear ci; sleep 1; /give ci rocket_launcher; sleep 1; hold rocket_launcher; camera first; sleep 1; screenshot held_rocket_launcher_first; camera behind 90; sleep 1; screenshot held_rocket_launcher_third; sleep 1; /clear ci; sleep 1; /give ci dirt; sleep 1; hold dirt; camera first; sleep 1; screenshot held_dirt_first; camera behind 90; sleep 1; screenshot held_dirt_third; sleep 1; /clear ci; sleep 1; /give ci planks_stairs; sleep 1; hold planks_stairs; camera first; sleep 1; screenshot held_planks_stairs_first; camera behind 90; sleep 1; screenshot held_planks_stairs_third; sleep 1; /clear ci; sleep 1; /give ci hoe; sleep 1; hold hoe; camera first; sleep 1; screenshot held_hoe_first; camera behind 90; sleep 1; screenshot held_hoe_third; sleep 1; quit"

      # Visual baselines: every scene of assets/baselines/images/scenes.txt
      # rendered on lavapipe and compared with its baseline, within tolerances;
      # the pictures, the differences and the logs are uploaded on a failure.
      - name: Visual baselines
        if: ${{ !cancelled() }}
        run: ./build.sh images
      - name: Visual baselines' pictures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: images
          path: build/images/
          if-no-files-found: ignore

      - name: AddressSanitizer
        if: ${{ !cancelled() }}
        run: |
          ./build.sh build --sanitize
          ASAN_OPTIONS=detect_leaks=0 xvfb-run -a ./build/voxiverse --frames 60
          ASAN_OPTIONS=detect_leaks=0 xvfb-run -a ./build/voxiverse --check fly

      # A release build's flight, profiled: the trace must be well formed.
      - name: Profiling
        if: ${{ !cancelled() }}
        run: |
          ./build.sh build --release --profile
          xvfb-run -a ./build/voxiverse --check fly
          python3 tools/debugger/check_spall.py build/voxiverse.spall
          # The view model's frame within its budget (judged on a release build).
          xvfb-run -a ./build/voxiverse --benchmark viewmodel
          # The optimized build's chunk budgets (tighter than a debug build's).
          xvfb-run -a ./build/voxiverse --check tour

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: build/screenshots/
          if-no-files-found: ignore

  # The same session's state hashes, from every OS at both optimization levels
  # must agree line by line: a divergence is named by tick and section.
  determinism:
    name: Determinism · all OSes
    needs: [gate, build, linux-tests]
    # Whatever the test jobs did: the logs that exist are compared.
    if: ${{ !cancelled() && needs.gate.outputs.tested != 'true' && needs.gate.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          pattern: determinism-*
          path: build/determinism
          merge-multiple: true
      # Every platform's pair of logs must be there (a job that died before
      # writing its logs is a failure here, not a smaller comparison).
      - name: Logs of every platform
        run: |
          missing=0
          for log in linux darwin windows; do
            for level in minimal speed; do
              if [ ! -f "build/determinism/$log.$level.txt" ]; then
                echo "::error::missing determinism log $log.$level.txt"
                missing=1
              fi
            done
          done
          ls build/determinism || true
          exit $missing
      # Compares what exists even when a log is missing, to show any difference too.
      - name: Compare
        if: ${{ !cancelled() }}
        run: ./build.sh determinism --compare build/determinism

  # Release packages: one per platform, from every push (kept
  # as workflow artifacts, for testers), each unpacked on its own and run
  # from there: nothing beside it is needed. macOS waits for its backend
  # Linux builds on the oldest supported Ubuntu, so the game runs on
  # older distributions (glibc).
  package:
    name: Package · ${{ matrix.name }}
    needs: gate
    if: ${{ needs.gate.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: Linux x64 }
          - { os: windows-latest, name: Windows x64 }
          - { os: macos-latest, name: macOS arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40 # the Windows package also plays a world on a software driver
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags: the version comes from them
      # Checkout fetches a pushed tag as a plain ref; its message (the
      # release's name) needs the tag object itself.
      - name: Tags
        shell: bash
        run: git fetch --force --tags origin

      - uses: ./.github/actions/setup

      - name: Package
        run: ${{ runner.os == 'Windows' && '.\build.bat' || './build.sh' }} package

      - name: Packages to run it (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt
        with:
          packages: xvfb mesa-vulkan-drivers

      - name: Run the package (Linux)
        if: runner.os == 'Linux'
        run: |
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n 1)"
          export VX_SAVES="$RUNNER_TEMP/saves" VX_SETTINGS="$RUNNER_TEMP/settings.cfg"
          tar -xzf build/dist/*.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/voxiverse-*-linux-x64
          ./voxiverse --version
          ./voxiverse-server --version
          ./voxiverse-server --universe "$RUNNER_TEMP/universe" --seconds 5
          timeout 600 xvfb-run -a ./voxiverse --exec "set render_distance 4; singleplayer; wait_world; screenshot package; wait 3; quit"
          ls screenshots/package.png

      - name: Run the package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = (Get-Item build\dist\*.zip).FullName
          $top = [IO.Path]::GetFileNameWithoutExtension($zip)
          # The paths as stored: all in the one folder of the zip's name;
          # never "./" (Explorer then shows an empty zip that will not
          # extract), "/" or "..".
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          $entries = $archive.Entries.FullName
          $archive.Dispose()
          $entries
          $bad = $entries | Where-Object { -not $_.StartsWith("$top/") -or $_ -match '(^|/)\.\.?(/|$)' }
          if ($bad) { "bad paths: $bad"; exit 1 }
          # As Explorer sees it (its own zip support): that one folder.
          $items = (New-Object -ComObject Shell.Application).NameSpace($zip).Items()
          if ($items.Count -ne 1 -or $items.Item(0).Name -ne $top) { "Explorer sees $($items.Count) items"; exit 1 }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\package"
          Set-Location "$env:RUNNER_TEMP\package\$top"
          .\voxiverse-server.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\voxiverse-server.exe --universe "$env:RUNNER_TEMP\universe" --seconds 5
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The game is a windowed program: PowerShell would not wait for it.
          $game = Start-Process .\voxiverse.exe -ArgumentList "--version" -Wait -PassThru
          if ($game.ExitCode -ne 0) { exit 1 }
          # The game itself, to a loaded world and a screenshot, on Mesa's
          # lavapipe (software Vulkan: the runner has no GPU). The driver and
          # the Vulkan loader are fetched by the build, pinned and hash
          # checked, and live outside the package, which stays as shipped.
          Push-Location $env:GITHUB_WORKSPACE
          $fetched = & .\build.bat lavapipe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Pop-Location
          $fetched
          $icd = ($fetched | Where-Object { $_ -like 'icd=*' }).Substring(4)
          $runtime = ($fetched | Where-Object { $_ -like 'runtime=*' }).Substring(8)
          # A loader older than the pinned runtime may predate VK_DRIVER_FILES
          # and find no driver (ERROR_INCOMPATIBLE_DRIVER): install the pinned one
          # unless the installed loader is at least as new.
          $loaderPath = "$env:SystemRoot\System32\vulkan-1.dll"
          $pinned = [version]((Split-Path $runtime -Leaf) -replace '^VulkanRT-(\d+\.\d+\.\d+\.\d+)-Installer\.exe$', '$1')
          $have = if (Test-Path $loaderPath) { [version]((Get-Item $loaderPath).VersionInfo.ProductVersion -replace ',', '.' -replace ' ', '') } else { $null }
          "Vulkan loader installed: $have; pinned: $pinned"
          if ($null -eq $have -or $have -lt $pinned) {
            Start-Process $runtime -ArgumentList "/S" -Wait
            if (-not (Test-Path $loaderPath)) { "the Vulkan loader did not install"; exit 1 }
            "Vulkan loader now: $((Get-Item $loaderPath).VersionInfo.ProductVersion)"
          }
          # What the loader will be given: the manifest and what sits beside it.
          Get-ChildItem (Split-Path $icd) | Format-Table Name, Length
          Get-Content $icd
          # The registry, not VK_DRIVER_FILES: the Vulkan loader ignores that
          # variable (and VK_ICD_FILENAMES) in an elevated process, as a
          # security rule, and the runners are elevated. It reads drivers from
          # this key: a REG_DWORD of 0 named with the manifest's absolute path.
          $icdFull = (Resolve-Path $icd).Path
          $key = "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name $icdFull -PropertyType DWord -Value 0 -Force | Out-Null
          Get-ItemProperty $key
          $env:VX_SAVES = "$env:RUNNER_TEMP\saves"
          $env:VX_SETTINGS = "$env:RUNNER_TEMP\settings.cfg"
          Remove-Item .\screenshots\package.png -ErrorAction SilentlyContinue
          # The Vulkan loader says on stderr which drivers it tried and why one failed.
          $env:VK_LOADER_DEBUG = "error,warn,driver"
          $env:VK_LOADER_LAYERS_DISABLE = "~all~"
          $loaderLog = "$env:RUNNER_TEMP\game-stderr.txt"
          $game = Start-Process .\voxiverse.exe -ArgumentList '--exec "set render_distance 4; singleplayer; wait_world; screenshot package; wait 3; quit"' -PassThru -RedirectStandardError $loaderLog
          if (-not $game.WaitForExit(600000)) {
            $game.Kill()
            "the game did not finish in 10 minutes"
            exit 1
          }
          if ($game.ExitCode -ne 0) {
            "the game exited with $($game.ExitCode)"
            Get-Content $loaderLog -TotalCount 100
            exit 1
          }
          if (-not (Test-Path .\screenshots\package.png)) { "no screenshots\package.png"; exit 1 }
          # The version information linked in (the file's Details tab).
          $info = (Get-Item .\voxiverse.exe).VersionInfo
          $info | Format-List ProductName, ProductVersion, FileDescription, FileVersion
          if ($info.ProductName -ne "Voxiverse") { exit 1 }

      # The crash bundle the played package left, if it died: every file of the
      # newest one is printed, and all of them are uploaded.
      - name: Crash bundles (Windows)
        if: ${{ failure() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\crashes"
          if (-not (Test-Path $dir)) { "no crashes directory"; exit 0 }
          $newest = Get-ChildItem $dir -Directory | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($newest) {
            Get-ChildItem $newest.FullName -File | ForEach-Object {
              "==== $($_.Name)"
              if ($_.Extension -eq ".txt") { Get-Content $_.FullName -TotalCount 200 }
            }
          }
      - name: Upload crash bundles (Windows)
        if: ${{ failure() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-crashes
          path: ${{ runner.temp }}\crashes
          if-no-files-found: ignore

      # Not run: no window server or GPU here. Unpacked as a user would, its
      # bundle checked and both programs asked for their version.
      - name: Check the package (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -x -k build/dist/*.zip "$RUNNER_TEMP/package"
          cd "$RUNNER_TEMP"/package/voxiverse-*-macos-arm64
          ls -l
          plutil -lint Voxiverse.app/Contents/Info.plist
          codesign --verify --deep --strict Voxiverse.app
          codesign --verify --strict voxiverse-server
          test -f Voxiverse.app/Contents/Frameworks/libMoltenVK.dylib
          test -f Voxiverse.app/Contents/Resources/Voxiverse.icns
          ./voxiverse-server --version
          Voxiverse.app/Contents/MacOS/voxiverse --version

      # The package itself, not zipped again: the artifact is the file, by
      # its own name.
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          path: build/dist/voxiverse-*.${{ runner.os == 'Linux' && 'tar.gz' || 'zip' }}
          archive: false
          retention-days: 30
          if-no-files-found: error

  # Every version tag (v*.*.*) makes a draft GitHub Release with the packages
  # and their checksums: nothing is public until it is looked at and published
  # by hand. The tag's message is the release's name.
  release:
    name: Draft release
    # Runs when the packages built and either main already tested this commit
    # (the test jobs were skipped) or every test job passed.
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v')
      && needs.package.result == 'success'
      && (needs.gate.outputs.tested == 'true'
      || (needs.build.result == 'success' && needs.linux-tests.result == 'success'
      && needs.linux-game.result == 'success' && needs.linux-images.result == 'success')) }}
    needs: [gate, build, linux-tests, linux-game, linux-images, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the history: the notes list the commits since the last tag
      - name: Tags
        run: git fetch --force --tags origin
      - uses: ./.github/actions/setup
      # The packages as files (a zip is not unpacked).
      - uses: actions/download-artifact@v8
        with:
          pattern: voxiverse-*
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          NAME="$(git for-each-ref --format='%(objecttype) %(contents:subject)' "refs/tags/$TAG")"
          case "$NAME" in
            "tag $TAG" | "tag $VERSION" | "commit "*) TITLE="Voxiverse $VERSION" ;;
            *) TITLE="Voxiverse ${NAME#tag } ($VERSION)" ;;
          esac
          ./build.sh release-notes "$TAG" "$RUNNER_TEMP/notes.md"
          cd dist
          ls -l
          # Exactly the three packages, as files, for this version.
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          test -f "voxiverse-$VERSION-windows-x64.zip"
          test -f "voxiverse-$VERSION-linux-x64.tar.gz"
          test -f "voxiverse-$VERSION-macos-arm64.zip"
          sha256sum * > SHA256SUMS
          gh release create "$TAG" --draft --prerelease --verify-tag --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" *

  # The Steam depots (`build steam`, docs/platforms.md): the three packages laid out as
  # one depot per OS with their SteamPipe scripts, kept as an artifact. The upload is a
  # second step that runs only where the STEAM_BUILDER secrets and the App ID exist, and
  # goes to the beta branch "playtest", never the default branch; without them it is
  # skipped and the job is green.
  steam:
    name: Steam depots
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.package.result == 'success' }}
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: steam
      cancel-in-progress: false
    env:
      STEAM_APP_ID: ${{ vars.STEAM_APP_ID }}
      STEAM_DEPOT_WINDOWS: ${{ vars.STEAM_DEPOT_WINDOWS }}
      STEAM_DEPOT_LINUX: ${{ vars.STEAM_DEPOT_LINUX }}
      STEAM_DEPOT_MACOS: ${{ vars.STEAM_DEPOT_MACOS }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags: the version comes from them
      - name: Tags
        run: git fetch --force --tags origin
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          pattern: voxiverse-*
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Lay out the depots
        run: ./build.sh steam dist
      - name: Upload the depot layout
        uses: actions/upload-artifact@v7
        with:
          name: steam-depots
          path: |
            build/steam/depots
            build/steam/scripts
          retention-days: 30
          if-no-files-found: error
      - name: Upload to Steam (branch playtest)
        env:
          STEAM_BUILDER_USER: ${{ secrets.STEAM_BUILDER_USER }}
          STEAM_BUILDER_PASSWORD: ${{ secrets.STEAM_BUILDER_PASSWORD }}
        run: |
          if [ -z "$STEAM_BUILDER_USER" ] || [ -z "$STEAM_BUILDER_PASSWORD" ] || [ -z "$STEAM_APP_ID" ]; then
            echo "No STEAM_BUILDER secrets or STEAM_APP_ID: not uploading to Steam."
            exit 0
          fi
          # Never a default-branch upload, whatever the script says.
          grep -qE '"setlive"[[:space:]]+"playtest"' build/steam/scripts/app_build.vdf # (build steam writes a tab)
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl -fsSL --retry 3 https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C "$RUNNER_TEMP/steamcmd"
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +login "$STEAM_BUILDER_USER" "$STEAM_BUILDER_PASSWORD" \
            +run_app_build "$PWD/build/steam/scripts/app_build.vdf" +quit

  # Every push to main whose packages built and whose Linux tests passed becomes the rolling
  # "playtest" pre-release: one fixed link, always the newest playable main, for every OS.
  playtest:
    name: Playtest build
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.package.result == 'success' && needs.build.result == 'success'
      && needs.linux-tests.result == 'success' }}
    needs: [build, linux-tests, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: playtest
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: voxiverse-*
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Replace the playtest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cd dist
          ls -l
          sha256sum * > SHA256SUMS
          subject=$(gh api "repos/${GH_REPO}/commits/${SHA}" --jq '.commit.message | split("\n")[0]')
          printf 'The newest `main` that passed its tests: `%s`, %s.\n\nLast change: %s\n\nThis release is replaced on every merge. Feedback: open an issue with the **Playtest feedback** form; an agent works on it.\n' \
            "${SHA::12}" "$(date -u '+%F %H:%M UTC')" "${subject}" > "${RUNNER_TEMP}/notes.md"
          gh release delete playtest --cleanup-tag --yes 2>/dev/null || true
          gh release create playtest --target "${SHA}" --prerelease --latest=false \
            --title "Playtest: newest main (${SHA::7})" --notes-file "${RUNNER_TEMP}/notes.md" *

  # The ONE check the main ruleset requires: every job above passed, or was skipped on
  # purpose (a Markdown-only change, or a tag whose commit main's CI already tested).
  result:
    name: CI result
    if: ${{ always() }}
    needs: [gate, build, linux-tests, linux-game, linux-images, determinism, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped on purpose
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "${RESULTS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "${RESULTS}" | jq '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")] | length')
          [ "${bad}" -eq 0 ]

  # main must stay green: a failed push to main opens (or updates) one "main is red" issue
  # labelled agent without a milestone, which the agents take before anything else
  # (autofix.yml); the next green push to main closes it.
  main-health:
    name: Main health
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [gate, build, linux-tests, linux-game, linux-images, determinism, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULTS: ${{ toJSON(needs) }}
          SHA: ${{ github.sha }}
          ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=$(echo "${RESULTS}" | jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")')
          cancelled=$(echo "${RESULTS}" | jq '[to_entries[] | select(.value.result == "cancelled")] | length')
          open=$(gh issue list --state open --label agent --search 'in:title "main is red"' --json number,title --jq '[.[] | select(.title == "main is red") | .number][0] // empty')
          # A first failure is rerun by the next agent sweep (autofix.yml): only a second one is
          # main being red (a flake passes the second time).
          if [ -n "${failed}" ] && [ "${ATTEMPT}" -lt 2 ]; then
            echo "failed once (${failed}): the sweep reruns it before it counts"
          elif [ -n "${failed}" ]; then
            body=$(printf 'CI failed on main at `%s` (jobs: %s).\n\nRun and logs: %s\n\nFix main first: find the failing step with `gh run view <run id> --log-failed`, fix the cause in one pull request (never weaken or skip a test), and say which commit broke it. If you cannot find the cause in this run (it fails only on an OS you cannot run, or you cannot reproduce it), revert the commit that broke it instead (`git revert`, a pull request ending `Fixes #<this issue>`), and comment on that commit'"'"'s task (reopen it if closed) with what you found, so it lands again with the failure found through its own pull request'"'"'s CI. Never leave main red for a guess. This issue closes itself when main is green again.\n' "${SHA::12}" "${failed}" "${RUN_URL}")
            if [ -n "${open}" ]; then gh issue comment "${open}" --body "${body}"
            else
              gh issue create --title "main is red" --label agent --body "${body}"
            fi
          elif [ "${cancelled}" -eq 0 ] && [ -n "${open}" ]; then
            gh issue close "${open}" --comment "main is green again at \`${SHA::12}\` (${RUN_URL})."
          fi
