name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

# Every OS sets up the way a developer does: odinup for the pinned toolchain,
# then the build driver (which fetches the pinned shader compiler itself).

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: ~/.odinup
          key: odinup-${{ runner.os }}-${{ hashFiles('odinup.toml') }}

      - name: Cache shader compiler
        uses: actions/cache@v4
        with:
          path: build/tools
          key: glslang-${{ runner.os }}-${{ hashFiles('tools/build/glslang.odin') }}

      - name: Toolchain (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          if [ ! -x "$HOME/.odinup/bin/odinup" ]; then
            ODIN="$(sed -n 's/^odin = "\(.*\)"/\1/p' odinup.toml)"
            curl -sSfL https://raw.githubusercontent.com/voxiverse/odinup/main/install.sh | ODINUP_ODIN_VERSION="$ODIN" sh
          fi
          echo "$HOME/.odinup/bin" >> "$GITHUB_PATH"

      - name: Toolchain (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (-not (Test-Path "$env:USERPROFILE\.odinup\bin\odinup.exe")) {
            $env:ODINUP_ODIN_VERSION = (Select-String -Path odinup.toml -Pattern '^odin = "(.*)"').Matches[0].Groups[1].Value
            irm https://raw.githubusercontent.com/voxiverse/odinup/main/install.ps1 | iex
          }
          "$env:USERPROFILE\.odinup\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Project tools (ols, odinfmt)
        run: |
          odinup install --dev
          odinup check --dev

      - name: Check
        run: ${{ runner.os == 'Windows' && '.\build.bat' || './build.sh' }} check
      - name: Test
        run: ${{ runner.os == 'Windows' && '.\build.bat' || './build.sh' }} test
      - name: Build game
        run: ${{ runner.os == 'Windows' && '.\build.bat' || './build.sh' }} build

      # Real frames on Mesa's CPU Vulkan driver under the validation layer:
      # any validation finding, leak, sanitizer report or failed check fails
      # the run.
      - name: Linux test packages (CPU Vulkan, xvfb, debuggers, tshark)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb mesa-vulkan-drivers vulkan-validationlayers gdb lldb tshark lua5.4
          echo "VK_DRIVER_FILES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n 1)" >> "$GITHUB_ENV"

      # The world streams through a flight and memory stays flat (fly_test,
      # M3's check), recorded: every message decodes, and replaying the
      # client's messages against a fresh server goes cleanly.
      - name: Flight, trace and replay (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ./build/voxiverse --frames 120
          xvfb-run -a ./build/voxiverse --exec "set debug.net_trace 1; set debug.net_latency_ms 30; set view_radius 6; set view_height 3; fly_test 600 quit"
          ./build.sh netdump -summary
          ./build.sh replay -speed:2

      # Bulk edits (M9): rockets and explosions, each shown whole, and the
      # client's chunks end up exactly the server's.
      - name: Blast test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./build/voxiverse --exec "set view_radius 4; set view_height 2; blast_test 12 quit"

      # Worldgen (M10): every biome visited, screenshotted (uploaded below),
      # within frame, generation and meshing budgets, memory flat.
      - name: Biome tour (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./build/voxiverse --exec "set view_radius 4; set view_height 3; tour_test quit"

      # The sky through a day (screenshots uploaded below).
      - name: Sky (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./build/voxiverse --exec "set view_radius 4; set view_height 2; singleplayer; wait_world; set rules.daylight_cycle 0; tp 0 12 0 -90 8; wait 30; time 0.26; wait 5; screenshot sky_sunrise; tp 0 12 0 -90 50; time 0.4; wait 5; screenshot sky_day; tp 0 12 0 90 8; time 0.77; wait 5; screenshot sky_dusk; tp 0 12 0 -90 20; time 0.8; wait 5; screenshot sky_night; wait 5; quit"

      # Over real sockets: a dedicated server and a client joining it, the
      # server capturing every packet; the Wireshark dissector must decode
      # them all (our harness, then tshark itself).
      - name: Multiplayer and Wireshark (Linux)
        if: runner.os == 'Linux'
        run: |
          ./build/voxiverse-server --world build/ci-world --view-radius 3 --view-height 2 --capture build/server.pcap > build/server.log 2>&1 &
          SERVER=$!
          for _ in $(seq 100); do grep -q "server listening" build/server.log && break; sleep 0.1; done
          grep "server listening" build/server.log
          xvfb-run -a ./build/voxiverse --exec "set name ci; set view_radius 3; set view_height 2; join 127.0.0.1; wait_world; wait 30; screenshot multiplayer; wait 5; quit"
          kill -INT $SERVER
          wait $SERVER
          lua5.4 tools/wireshark/check.lua build/server.pcap
          tshark -X lua_script:tools/wireshark/voxiverse.lua -r build/server.pcap -Y voxiverse > build/tshark.txt
          head -n 20 build/tshark.txt
          test "$(wc -l < build/tshark.txt)" -gt 50
          test -z "$(tshark -X lua_script:tools/wireshark/voxiverse.lua -r build/server.pcap -Y '_ws.malformed || voxiverse.malformed')"

      # A crash is reported with our stack, and still fails the run.
      - name: Crash handler (Linux)
        if: runner.os == 'Linux'
        run: |
          if xvfb-run -a ./build/voxiverse --exec crash > build/crash.txt 2>&1; then echo "crash did not crash"; exit 1; fi
          grep 'crash signal=SIGSEGV' build/crash.txt && grep 'at client::console_execute' build/crash.txt

      - name: AddressSanitizer (Linux)
        if: runner.os == 'Linux'
        run: |
          ./build.sh build --sanitize
          ASAN_OPTIONS=detect_leaks=0 xvfb-run -a ./build/voxiverse --frames 60
          ASAN_OPTIONS=detect_leaks=0 xvfb-run -a ./build/voxiverse --exec "set view_radius 4; set view_height 2; fly_test 200 quit"

      # A release build's flight, profiled: the trace must be well formed.
      - name: Profiling (Linux)
        if: runner.os == 'Linux'
        run: |
          ./build.sh build --release --profile
          xvfb-run -a ./build/voxiverse --exec "set view_radius 6; set view_height 3; fly_test 300 quit"
          python3 tools/debugger/check_spall.py build/voxiverse.spall
          # The optimized build's chunk budgets (tighter than a debug build's).
          xvfb-run -a ./build/voxiverse --exec "set view_radius 4; set view_height 3; tour_test quit"

      - name: Screenshots (Linux)
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots/
          if-no-files-found: ignore

      - name: Debugger printers (Linux)
        if: runner.os == 'Linux'
        run: tools/debugger/test_printers.sh
