name: refresh
# When main moves, every open pull request whose CI result failed BEFORE main's newest commit is
# rebased onto main, so its CI runs again against the fixed main (a red result that was main's
# fault clears itself; a real failure fails again). Plain git and gh, no agent. A push made with
# this job's token starts no workflow (GitHub's rule), so CI is then started by hand on the branch
# (workflow_dispatch, which that token may start); its checks land on the branch's new head.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          head_time=$(gh api "repos/${GH_REPO}/commits/main" --jq .commit.committer.date)
          gh pr list --state open --limit 100 --json number,headRefName,isDraft,statusCheckRollup --jq '.[]
            | select(.isDraft | not)
            | [.number, .headRefName, ([.statusCheckRollup[] | select(.name == "CI result")] | first | "\(.conclusion // "") \(.completedAt // "")")] | @tsv' |
          while IFS=$'\t' read -r n branch result; do
            conclusion=${result%% *}; done_at=${result#* }
            [ "${conclusion}" = FAILURE ] || continue
            # Failed before main's newest commit: main may have fixed it.
            if [[ "${done_at}" < "${head_time}" ]]; then
              echo "#${n}: failed at ${done_at}, main moved at ${head_time}: rebasing"
              if gh pr update-branch "${n}" --rebase; then
                sleep 5
                gh workflow run ci.yml --ref "${branch}" && echo "#${n}: CI started on ${branch}"
              else
                echo "#${n}: could not rebase (conflict?): left as is"
              fi
            fi
          done
