# Voxiverse permissions (written by the server; see docs/debugging.md)
role admin
inherit mod
grant *
meta prefix &c&lAdmin
role default
grant world.edit
grant chat.send
grant chat.msg
grant chat.me
grant chat.ignore
grant chat.afk
grant teleport.spawn
grant teleport.home
grant teleport.warp
grant teleport.tpa
grant teleport.back
grant info.*
grant -info.stats.others
grant items.wear
meta max_homes 3
role mod
inherit default
grant chat.*
grant moderation.*
grant teleport.tp
meta prefix &e&lMod
